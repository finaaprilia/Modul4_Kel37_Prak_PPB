    <rect x="100" y="96" width="30" height="12" fill="#334155"/>
    <circle cx="165" cy="108" r="4" fill="#a67c2e"/>
    
    <!-- Pistol Grip -->
    <path d="M 105 126 L 125 126 L 115 175 Q 110 180 98 178 L 92 168 Z" fill="#a67c2e"/>
    
    <!-- Trigger & Guard -->
    <path d="M 125 126 C 125 145 145 145 145 126" stroke="#18222c" stroke-width="4" fill="none"/>
    <path d="M 135 126 Q 140 136 135 140" stroke="#18222c" stroke-width="3" fill="none"/>
    
    <!-- Curved Magazine -->
    <path d="M 148 126 Q 165 170 195 200 L 170 210 Q 140 175 128 126 Z" fill="#1e293b"/>
    <path d="M 153 135 Q 167 170 190 198" stroke="#334155" stroke-width="3" fill="none"/>
    
    <!-- Handguard / Gas Tube -->
    <path d="M 195 92 L 275 95 L 270 118 L 195 118 Z" fill="#a67c2e"/>
    <line x1="200" y1="100" x2="270" y2="102" stroke="#18222c" stroke-width="3"/>
    
    <!-- Barrel & Gas Block -->
    <rect x="270" y="98" width="80" height="10" fill="#0f172a"/>
    <path d="M 265 88 L 275 88 L 275 98 L 265 98 Z" fill="#18222c"/>
    <!-- Front sight -->
    <path d="M 330 85 L 340 85 L 342 98 L 328 98 Z" fill="#18222c"/>
    <rect x="334" y="78" width="4" height="7" fill="#a67c2e"/>
    <!-- Muzzle -->
