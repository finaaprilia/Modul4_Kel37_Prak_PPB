<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f4f6f8"/>
  <g transform="translate(18, 55)">
    <path d="M 0 160 L 364 160" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Stock (Wood/Polymer) -->
    <path d="M 20 100 L 80 95 L 90 125 L 30 135 Z" fill="#a67c2e"/>
    <path d="M 15 98 L 25 97 L 35 136 L 25 137 Z" fill="#18222c"/>
    
    <!-- Receiver -->
