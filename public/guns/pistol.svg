<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f4f6f8"/>
  <g transform="translate(50, 45)">
    <path d="M 0 190 L 300 190" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Slide -->
    <path d="M 40 50 L 250 50 L 250 95 L 240 105 L 40 105 Z" fill="#18222c"/>
    <path d="M 40 50 L 250 50 L 250 65 L 40 65 Z" fill="#2c3e50"/>
    <!-- Serrations -->
    <path d="M 50 58 L 50 95 M 56 58 L 56 95 M 62 58 L 62 95 M 68 58 L 68 95 M 74 58 L 74 95" stroke="#5a6673" stroke-width="2.5"/>
    
    <!-- Barrel Front & Sights -->
    <rect x="250" y="65" width="20" height="30" fill="#0f172a" rx="2"/>
    <rect x="240" y="42" width="6" height="8" fill="#a67c2e"/>
    <rect x="45" y="45" width="6" height="5" fill="#5a6673"/>
    
    <!-- Ejection Port -->
    <rect x="140" y="55" width="35" height="15" fill="#334155" rx="1"/>

    <!-- Frame -->
    <path d="M 60 105 L 240 105 L 235 120 L 150 120 L 150 155 C 150 165 140 170 130 165 L 125 120 L 60 105 Z" fill="#1e293b"/>
    
    <!-- Trigger Guard -->
    <path d="M 125 120 C 125 155 160 155 160 120" stroke="#18222c" stroke-width="6" fill="none"/>
    
    <!-- Trigger -->
    <path d="M 140 120 Q 148 135 140 143" stroke="#a67c2e" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Grip -->
    <path d="M 60 105 L 120 118 L 95 220 Q 90 230 75 230 L 50 225 Q 40 215 45 200 L 60 105 Z" fill="#18222c"/>
    <!-- Grip Texture overlay -->
    <path d="M 68 125 L 110 133 L 90 215 L 55 208 Z" fill="#2d3748"/>
    <path d="M 70 135 L 105 142 M 68 145 L 103 152 M 66 155 L 101 162 M 64 165 L 99 172 M 62 175 L 97 182 M 60 185 L 95 192" stroke="#18222c" stroke-width="2"/>
    
    <!-- Magazine Baseplate -->
    <path d="M 45 222 L 82 229 L 80 236 L 40 230 Z" fill="#0f172a"/>
  </g>
</svg>
